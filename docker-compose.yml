services:
  postgres:
    image: postgres:17-alpine
    container_name: sg-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arcevodev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-sovgrant}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arcevodev} -d ${POSTGRES_DB:-sovgrant}"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 512m

  redis:
    image: redis:7-alpine
    container_name: sg-redis
    restart: unless-stopped
    command: ["sh", "-c", "redis-server --requirepass $$REDIS_PASSWORD"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 128m

  api:
    image: ${API_IMAGE:-ghcr.io/fusorb/sovgrant-api:latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: sg-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-arcevodev}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sovgrant}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    mem_limit: 512m

  workers:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: sg-workers
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://\:\@postgres:5432/\?schema=public
      REDIS_URL: redis://:\@redis:6379
    command: ["node", "dist/start-workers.js"]
    mem_limit: 256m

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local

services:
  postgres:
    image: postgres:17-alpine
    container_name: sg-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: \
      POSTGRES_PASSWORD: \
      POSTGRES_DB: \
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \ -d \"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 512m

  redis:
    image: redis:7-alpine
    container_name: sg-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "\"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "\", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 128m

  api:
    image: \
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: sg-api
    restart: unless-stopped
    ports:
      - "\:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://\:\@postgres:5432/\?schema=public
      REDIS_URL: redis://:\@redis:6379
    mem_limit: 512m

  workers:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: sg-workers
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://\:\@postgres:5432/\?schema=public
      REDIS_URL: redis://:\@redis:6379
    command: ["node", "dist/start-workers.js"]
    mem_limit: 256m

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local

allowBuilds:
  "@prisma/engines": true
  argon2: true
  cbor-extract: true
  esbuild: true
  msw: true
  prisma: true
  sharp: true
  unrs-resolver: true

# react-hook-form@7.84+ added a `react-server` export condition that omits
# Controller/FormProvider/useFormContext/useForm. @arcevo/facet-components
# imports these from react-hook-form, and when used in the Next.js Server
# Component graph the build resolves via `react-server` and fails.
# Pin below 7.84 so the main ESM entry (which has the full export surface)
# is always used.
overrides:
  react-hook-form: 7.83.0
packages:
  - "packages/*"

minimumReleaseAgeExclude:
  - '@fusorb/facet-auth@1.3.1 || 1.3.7 || 2.0.0'
  - '@fusorb/facet-components@2.0.1 || 3.1.0'
  - '@fusorb/facet-layout@1.5.1 || 1.5.7 || 1.6.0'
  - '@fusorb/facet-motion@1.0.1'
  - '@fusorb/facet-sdk@1.2.1 || 2.0.0'
  - '@fusorb/facet-tokens@1.2.0'
  - '@fusorb/facet-utils@0.1.0'
  - '@fusorb/facet-docs@1.5.7 || 1.5.8'
  - '@fusorb/facet-store@1.0.2'

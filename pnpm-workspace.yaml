allowBuilds:
  "@prisma/engines": true
  argon2: true
  cbor-extract: true
  esbuild: true
  msw: true
  prisma: true
  sharp: true
  unrs-resolver: true

# react-hook-form@7.84+ added a `react-server` export condition that omits
# Controller/FormProvider/useFormContext/useForm. @fusorb/facet-components
# imports these from react-hook-form, and when used in the Next.js Server
# Component graph the build resolves via `react-server` and fails.
# Pin below 7.84 so the main ESM entry (which has the full export surface)
# is always used.
overrides:
  react-hook-form: 7.83.0
  "@xmldom/xmldom@^0.8.0": "0.8.15"
  "brace-expansion@^1.0.0": "1.1.19"
  "brace-expansion@^2.0.0": "2.1.5"
  "brace-expansion@^3.0.0": "3.0.7"
  "brace-expansion@^5.0.0": "5.0.11"
  "deepmerge-ts@^7.0.0": "8.0.0"
  "dompurify@^3.0.0": "3.4.17"
  "fast-uri@^2.0.0": "2.4.6"
  "fast-uri@^3.0.0": "3.1.7"
  "fast-uri@^4.0.0": "4.1.4"
  "mysql2@^3.0.0": "3.22.0"
  "sharp@^0.35.0": "0.35.5"
  "source-map-js@^1.0.0": "1.2.2"
packages:
  - "packages/*"

minimumReleaseAgeExclude:
  - '@fusorb/facet-auth@1.3.1 || 1.3.7 || 2.0.0 || 2.0.2 || 2.1.0 || 2.1.1 || 2.1.2'
  - '@fusorb/facet-components@2.0.1 || 3.1.0 || 3.2.0 || 3.2.1 || 3.2.2'
  - '@fusorb/facet-layout@1.5.1 || 1.5.7 || 1.6.0 || 1.7.1 || 1.7.2'
  - '@fusorb/facet-motion@1.0.1 || 1.2.2 || 1.2.3'
  - "@fusorb/facet-sdk@1.2.1 || 2.0.0 || 2.1.0 || 2.1.1 || 3.0.0 || 4.0.0 || 4.0.1"
  - '@fusorb/facet-tokens@1.2.0 || 1.5.1'
  - '@fusorb/facet-utils@0.1.0 || 0.1.1'
  - '@fusorb/facet-store@1.0.2 || 1.0.3 || 1.0.4 || 1.0.5 || 1.0.6'
  - '@fusorb/facet-emails@1.1.4'

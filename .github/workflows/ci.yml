name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: 0
  DATABASE_URL: postgresql://test:test@localhost:5432/sovgrant_test
  # The migration drift check replays the whole chain into this database. The
  # service container only creates DATABASE_URL's database, so a step below
  # creates this one before the guard runs.
  SHADOW_DATABASE_URL: postgresql://test:test@localhost:5432/sovgrant_shadow
  JWT_SECRET: ci-test-secret-must-be-at-least-32-chars
  COOKIE_SECRET: ci-test-cookie-secret-32-chars-min
  WEBHOOK_SIGNING_SECRET: ci-test-webhook-secret
  RESEND_API_KEY: re_ci_placeholder
  SG_DIRECT_CLIENT_ID: sg-direct

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: sovgrant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Validate Prisma schema
        run: npx prisma validate --schema=prisma/schema.prisma

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Scan for secrets / PII
        run: pnpm scan:secrets

      - name: Scan dependencies for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          ignore-unfixed: true
          exit-code: "1"
          severity: "CRITICAL,HIGH"

      - name: Test
        run: pnpm test

      - name: CLI typecheck
        run: pnpm cli:typecheck

      - name: CLI build
        run: pnpm cli:build

      - name: Create shadow database (migration drift check)
        run: node scripts/create-shadow-db.mjs

      - name: Migration rollback guard (live Postgres)
        run: pnpm test:rollback
        env:
          # Tier 2 of this guard is opt-in on this flag. Without it the step ran
          # only the static Tier-1 checks and verified nothing about drift: green
          # on every push, which is how the 2026-11-11 schema drift survived.
          ARC_ID_ROLLBACK_TEST: "1"

      - name: Build API
        run: pnpm build:api

      - name: Build web
        run: pnpm build:web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
